<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camagru - Reset Password</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><strong>Camagru</strong></li>
            </ul>
            <ul>
                <li><a href="./gallery.html">Gallery</a></li>
                <li><a href="./login.html">Login</a></li>
                <li><a href="./register.html">Register</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Reset Password</h1>
        <form action="/reset-password" method="post">
            <label for="actual-password">Actual Password</label>
            <input type="password" id="actual-password" name="actual-paswword" required>

            <label for="new-password">New Password</label>
            <input type="password" id="new-password" name="new-paswword" required>

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-paswword" required>

            <button type="submit">Reset</button>
        </form>
    </main>
    <footer>
        <small>Camagru — 42 Web Project</small>
    </footer>
</body>
</html>
