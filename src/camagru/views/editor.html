<h1>Edit</h1>

<div class="editor">
    <section id="capture" data-csrf-token="$csrf_token">
        <canvas id="canvas" width="640" height="480" hidden></canvas>
        <video class="preview" id="preview" width="640" height="480" autoplay muted playsinline></video>
        <img class="preview" id="upload-preview" alt="Uploaded image" hidden>
        <p id="preview-error" class="errors" role="alert"></p>

        <fieldset>
            <legend>Choose an overlay:</legend>
            <label><input type="checkbox" name="overlay" value="cat"> Cat</label>
            <label><input type="checkbox" name="overlay" value="frame"> Frame</label>
            <label><input type="checkbox" name="overlay" value="hat"> Hat</label>
        </fieldset>

        <fieldset>
            <button id="capture-button" type="button" disabled>Edit</button>
        </fieldset>

        <label for="upload">Or upload an image</label>
        <input type="file" id="upload" name="photo" accept="image/*">
    </section>

    <aside>
        <h2>My photos</h2>
        $photos
    </aside>
</div>

<script src="/static/editor.js" defer></script>
