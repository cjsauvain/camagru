<h1>Edit</h1>

<div class="editor">
    <section id="capture" data-csrf-token="$csrf_token">
        <canvas id="canvas" width="640" height="480" hidden></canvas>
        <video class="preview" id="preview" width="640" height="480" autoplay muted playsinline></video>
        <p id="preview-error" class="errors" role="alert"></p>

        <fieldset>
            <legend>Choose an overlay:</legend>
            <label><input type="radio" name="overlay" value="cat"> Cat</label>
            <label><input type="radio" name="overlay" value="frame"> Frame</label>
            <label><input type="radio" name="overlay" value="hat"> Hat</label>
        </fieldset>

        <fieldset>
            <button id="capture-button" type="button" disabled>Edit</button>
        </fieldset>

        <label for="upload">Or upload an image</label>
        <input type="file" id="upload" name="photo" accept="image/*">
    </section>

    <aside>
        <h2>My photos</h2>
        <article>
            <img src="/static/demo1.png" alt="Photo taken on September 19">
            <form action="/images/1/delete" method="post">
                <input type="hidden" name="csrf_token" value="$csrf_token">

                <button>Delete</button>
            </form>
        </article>
        <article>
            <img src="/static/demo2.png" alt="Photo taken on September 18">
            <form action="/images/2/delete" method="post">
                <input type="hidden" name="csrf_token" value="$csrf_token">

                <button>Delete</button>
            </form>
        </article>
        <article>
            <img src="/static/demo3.png" alt="Photo taken on September 15">
            <form action="/images/3/delete" method="post">
                <input type="hidden" name="csrf_token" value="$csrf_token">

                <button>Delete</button>
            </form>
        </article>
    </aside>
</div>

<script src="/static/editor.js" defer></script>
